<!doctype html>
<html>
  <head><title>Netlify form detection</title></head>
  <body>
    <!--
      GENERATED by scripts/generate-forms.mjs from content/forms.json and
      content/services/items/*.json — do not edit by hand. Netlify's build-time
      parser only sees static HTML, not React-rendered markup, so these stubs
      exist solely to register every form and field.
    -->
    <form name="renovation-inquiry" data-netlify="true" data-netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
      <input type="hidden" name="form-name" value="renovation-inquiry" />
      <input name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <textarea name="message"></textarea>
      <input type="file" name="photos" />
    </form>

    <form name="rentals-inquiry" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="rentals-inquiry" />
      <input name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <textarea name="message"></textarea>
    </form>

    <form name="products-inquiry" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="products-inquiry" />
      <input name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <textarea name="message"></textarea>
      <input type="checkbox" name="products" />
      <input type="text" name="other_product" />
    </form>

    <form name="start-a-project" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="start-a-project" />
      <input name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <select name="project_type"><option>Renovation and Maintenance</option><option>Rentals</option><option>Wooden Products</option><option>Not sure yet</option></select>
      <input type="checkbox" name="products" />
      <input type="text" name="other_product" />
    </form>

    <form name="leave-a-review" data-netlify="true" data-netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
      <input type="hidden" name="form-name" value="leave-a-review" />
      <input name="bot-field" />
      <input type="text" name="name" />
      <input type="text" name="company" />
      <input type="text" name="position" />
      <textarea name="review"></textarea>
      <input type="file" name="photo" />
    </form>
  </body>
</html>
