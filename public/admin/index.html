<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Wood Hive — Content Manager</title>
    <!-- Netlify Identity is what actually logs an editor in; git-gateway
         (set in config.yml) then uses that login to commit content
         changes to the repo on the editor's behalf. Both must be turned
         on in the Netlify dashboard — see the setup note in the repo
         README. -->
    <script defer src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>
  <body>
    <script defer src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      // Standard Netlify Identity <-> Decap redirect glue: without this,
      // clicking the invite/confirmation email link lands on the site's
      // homepage instead of back here where the login can complete.
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", (user) => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/admin/";
            });
          }
        });
      }
    </script>
  </body>
</html>
